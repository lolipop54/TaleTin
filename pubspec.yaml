name: taletin
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.5+50

environment:
  sdk: ^3.13.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  drift: 2.34.4
  archive: 4.2.0
  xml: 6.6.1
  html: 0.15.7
  crypto: 3.0.7
  uuid: 4.6.0
  path_provider: 2.1.6
  path: 1.9.1
  meta: ^1.19.0
  # 字素簇边界判定：分页切分点与选区不拆 emoji / 代理对
  characters: 1.4.1
  # 只在显示层分析英文断字，原文及 Locator 的偏移保持不变。
  hyphen: 0.4.0
  # 原书排版模式的 WebView 容器（docs/原书排版模式实现计划.md）
  flutter_inappwebview: 6.1.5
  # 离线听书的后台媒体服务与音频焦点（docs/离线听书实现计划.md 第 4 节）。
  # 只承载前台服务、MediaSession 与通知；正文队列在应用级 Dart 控制器里。
  audio_service: 0.18.19
  audio_session: 0.2.4
  forui: 0.27.3
  curved_navigation_bar: 1.0.6
  # 书架离线拼音排序，不依赖 Android 系统版本。
  lpinyin: 2.0.3

# Android 实现包打了一行 AGP 9 兼容补丁后放在 third_party/，
# 原因与移除时机见 third_party/flutter_inappwebview_android/README.gt.md
dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  drift_dev: 2.34.6
  build_runner: ^2.16.1
  pigeon: ^29.0.2
  riverpod: ^3.4.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons_used/
    - assets/pics/无动画.webp
    - assets/pics/平移翻页.webp
    - assets/pics/覆盖翻页.webp
    - assets/pics/仿真翻页.webp
    - assets/pics/滚动.webp
    - assets/achievements/
    - assets/hyphenation/
    - assets/fonts/reading_quote/OFL.txt
    # 原书排版模式的框架页（host.css / host.js），由 WebView 拦截器按虚拟地址提供
    - assets/webview/

  fonts:
    # 明确字重：部分 Bold 文件的内部标签仍是 400，以文件夹配对为准。
    - family: gt-preset-cangeryumo
      fonts:
        - asset: assets/fonts/preset/仓耳与墨/仓耳与墨.ttf
          weight: 400
        - asset: assets/fonts/preset/仓耳与墨/仓耳与墨-Bold.ttf
          weight: 700
    - family: gt-preset-cangeryuyang
      fonts:
        - asset: assets/fonts/preset/仓耳渔阳体/仓耳渔阳体.ttf
          weight: 400
        - asset: assets/fonts/preset/仓耳渔阳体/仓耳渔阳体-Bold.ttf
          weight: 700
    - family: gt-preset-cangershuyuan
      fonts:
        - asset: assets/fonts/preset/仓耳舒圆体/仓耳舒圆体.ttf
          weight: 400
        - asset: assets/fonts/preset/仓耳舒圆体/仓耳舒圆体-Bold.ttf
          weight: 700
    - family: gt-preset-jingnanbobo
      fonts:
        - asset: assets/fonts/preset/荆南波波黑.ttf
          weight: 400
    - family: gt-preset-screenserif
      fonts:
        - asset: assets/fonts/preset/思源屏显臻宋.ttf
          weight: 400
    - family: gt-preset-lxgwwenkai
      fonts:
        - asset: assets/fonts/preset/霞鹜文楷/霞鹜文楷.ttf
          weight: 400
        - asset: assets/fonts/preset/霞鹜文楷/霞鹜文楷-Bold.ttf
          weight: 700
    - family: gt-preset-lxgwmanhei
      fonts:
        - asset: assets/fonts/preset/霞鹜漫黑.ttf
          weight: 400
    - family: gt-preset-lxgwzhenkai
      fonts:
        - asset: assets/fonts/preset/霞鹜臻楷.ttf
          weight: 400
    - family: gt-preset-homepencil
      fonts:
        - asset: assets/fonts/preset/宅在家自動筆.ttf
          weight: 400
    - family: gt-preset-ideals
      fonts:
        - asset: assets/fonts/preset/自由理想体.ttf
          weight: 400
    # BEGIN GENERATED FONT PREVIEWS
    # Name previews only; full fonts above remain unchanged.
    - family: gt-preview-cangeryumo
      fonts:
        - asset: assets/fonts/preview/gt-preview-cangeryumo-400.ttf
          weight: 400
        - asset: assets/fonts/preview/gt-preview-cangeryumo-700.ttf
          weight: 700
    - family: gt-preview-cangeryuyang
      fonts:
        - asset: assets/fonts/preview/gt-preview-cangeryuyang-400.ttf
          weight: 400
        - asset: assets/fonts/preview/gt-preview-cangeryuyang-700.ttf
          weight: 700
    - family: gt-preview-cangershuyuan
      fonts:
        - asset: assets/fonts/preview/gt-preview-cangershuyuan-400.ttf
          weight: 400
        - asset: assets/fonts/preview/gt-preview-cangershuyuan-700.ttf
          weight: 700
    - family: gt-preview-jingnanbobo
      fonts:
        - asset: assets/fonts/preview/gt-preview-jingnanbobo-400.ttf
          weight: 400
    - family: gt-preview-screenserif
      fonts:
        - asset: assets/fonts/preview/gt-preview-screenserif-400.ttf
          weight: 400
    - family: gt-preview-lxgwwenkai
      fonts:
        - asset: assets/fonts/preview/gt-preview-lxgwwenkai-400.ttf
          weight: 400
        - asset: assets/fonts/preview/gt-preview-lxgwwenkai-700.ttf
          weight: 700
    - family: gt-preview-lxgwmanhei
      fonts:
        - asset: assets/fonts/preview/gt-preview-lxgwmanhei-400.ttf
          weight: 400
    - family: gt-preview-lxgwzhenkai
      fonts:
        - asset: assets/fonts/preview/gt-preview-lxgwzhenkai-400.ttf
          weight: 400
    - family: gt-preview-homepencil
      fonts:
        - asset: assets/fonts/preview/gt-preview-homepencil-400.ttf
          weight: 400
    - family: gt-preview-ideals
      fonts:
        - asset: assets/fonts/preview/gt-preview-ideals-400.ttf
          weight: 400
    # END GENERATED FONT PREVIEWS
    - family: ReadingQuote
      fonts:
        - asset: assets/fonts/reading_quote/LongCang-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
